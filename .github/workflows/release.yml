name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The tag is the single source of truth for the version - nothing in the repo
      # itself needs bumping before a release.
      - name: Derive version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
            throw "Tag '$tag' is not in vX.Y.Z form."
          }
          "version=$($Matches[1])" >> $env:GITHUB_OUTPUT

      - run: dotnet test --configuration Release

      - name: Publish framework-dependent build
        run: >-
          dotnet publish FullscreenToggle.csproj -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -o publish/framework-dependent

      - name: Publish standalone build
        run: >-
          dotnet publish FullscreenToggle.csproj -c Release
          -p:Standalone=true -p:Version=${{ steps.version.outputs.version }}
          -o publish/standalone

      - name: Package artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null

          Compress-Archive `
            -Path publish/framework-dependent/FullscreenToggle.exe `
            -DestinationPath "artifacts/FullscreenToggle-${{ steps.version.outputs.version }}-win-x64.zip"

          Compress-Archive `
            -Path publish/standalone/FullscreenToggle.exe `
            -DestinationPath "artifacts/FullscreenToggle-${{ steps.version.outputs.version }}-win-x64-standalone.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "artifacts/FullscreenToggle-${{ steps.version.outputs.version }}-win-x64.zip"
          "artifacts/FullscreenToggle-${{ steps.version.outputs.version }}-win-x64-standalone.zip"
          --title "${{ github.ref_name }}"
          --generate-notes
